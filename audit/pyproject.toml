[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit"
version = "0.1.0"
description = "Similarity audit tool: measures cabinet-level parametric coverage over real order drawings (issue #1). Standalone, removable; independent of the C# plugin."
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "pillow>=10",
    "numpy>=1.26",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
audit = "audit_tool.cli:main"

[tool.setuptools.packages.find]
# Import package is "audit_tool" (not "audit") so the audit/ project directory
# on sys.path can never shadow the installed package via namespace packages.
include = ["audit_tool*"]
